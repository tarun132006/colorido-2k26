<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Event | COLORIDO 2K26</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="nav"></div>

<header class="page-head"><div class="wrap">
  <p class="eyebrow" style="color:#94a3b8" id="crumb">Event</p>
  <h1 id="title">Loading…</h1>
  <p id="sub"></p>
</div></header>

<section><div class="wrap">
  <div class="detail">
    <div>
      <div class="panel-box"><h2>Overview</h2><p id="desc"></p></div>
      <div class="panel-box"><h2>Rules</h2><ul class="rules" id="rules"></ul></div>
      <div class="panel-box"><h2>Eligibility</h2><p id="elig"></p></div>
      <div class="panel-box" id="resultsBox" hidden>
        <h2>Results</h2>
        <table class="data"><thead><tr><th>Position</th><th>Winner</th><th>College</th></tr></thead><tbody id="results"></tbody></table>
      </div>
    </div>
    <aside class="side"><div class="panel-box">
      <h2>Details</h2>
      <div id="kv"></div>
      <a class="btn btn-primary" id="regBtn" href="/register.html">Register for this event</a>
    </div></aside>
  </div>
</div></section>

<div id="footer"></div>
<script src="/js/app.js"></script>
<script>
renderChrome("");
const slug = new URLSearchParams(location.search).get("slug");
const crumbEl = document.getElementById("crumb");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const descEl = document.getElementById("desc");
const rulesEl = document.getElementById("rules");
const eligEl = document.getElementById("elig");
const regBtnEl = document.getElementById("regBtn");

function teamText(e) {
  if (e.team_max === 1) return "Solo";
  return e.team_min === e.team_max ? `${e.team_max} members` : `${e.team_min} to ${e.team_max} members`;
}
const kv = (k, v) => `<div class="kv"><span>${k}</span><b>${esc(v)}</b></div>`;

(async () => {
  if (!slug) { titleEl.textContent = "Event not found"; return; }
  try {
    const e = await api("/events/" + encodeURIComponent(slug));
    document.title = e.name + " | COLORIDO 2K26";
    crumbEl.textContent = e.category + (e.division === "sports" ? " · " + e.gender : "");
    titleEl.textContent = e.name;
    subEl.textContent = e.division === "sports" ? "Sports" : "Cultural";
    descEl.textContent = e.description;
    eligEl.textContent = e.eligibility;
    rulesEl.innerHTML = e.rules.map(r => `<li>${esc(r)}</li>`).join("");
    const kvEl = document.getElementById("kv");
    kvEl.innerHTML =
      kv("Format", teamText(e)) + kv("Day", "Day " + e.day) + kv("Time", e.start_time) +
      kv("Venue", e.venue) + kv("Entry fee", e.fee ? "₹" + e.fee : "Free") +
      kv("Prize", e.prize) + kv("Coordinator", e.coordinator) + kv("Contact", e.phone);
    regBtnEl.href = "/register.html?event=" + encodeURIComponent(e.slug);

    const res = await api("/results?event_slug=" + encodeURIComponent(e.slug));
    if (res.length) {
      document.getElementById("resultsBox").hidden = false;
      document.getElementById("results").innerHTML = res.map(r =>
        `<tr><td>${r.position}</td><td>${esc(r.winner)}</td><td>${esc(r.college || "")}</td></tr>`).join("");
    }
  } catch (err) { titleEl.textContent = "Event not found"; toast(err.message); }
})();
</script>
</body>
</html>
