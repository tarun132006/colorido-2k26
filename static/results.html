<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results · COLORIDO 2K26</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div>
<header class="page-head"><div class="wrap"><p class="eyebrow">COLORIDO 2K26</p><h1>Results</h1><p>Published winners and podium results will appear here.</p></div></header><section><div class="wrap"><div class="panel-box"><div id="results"><p class="empty">Loading results…</p></div></div></div></section><div id="footer"></div><script src="/js/app.js"></script><script>renderChrome("Results");(async()=>{try{const rows=await api("/results");const el=document.getElementById("results");if(!rows.length){el.innerHTML='<div class="empty"><h2>Results not published yet</h2><p>Official COLORIDO 2K26 results will be displayed here after coordinators publish them.</p></div>';return;}const groups={};rows.forEach(r=>(groups[r.event]??=[]).push(r));el.innerHTML=Object.entries(groups).map(([event,items])=>`<div class="panel-box"><h2>${esc(event)}</h2><table class="data"><thead><tr><th>Position</th><th>Winner</th><th>College</th></tr></thead><tbody>${items.map(r=>`<tr><td>${esc(r.position)}</td><td>${esc(r.winner)}</td><td>${esc(r.college||"—")}</td></tr>`).join("")}</tbody></table></div>`).join("");}catch(e){document.getElementById("results").innerHTML='<p class="empty">Unable to load results right now.</p>';toast(e.message)}})();initReveal();</script></body></html>
