<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · COLORIDO 2K26</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div>
<header class="page-head"><div class="wrap"><p class="eyebrow">COLORIDO 2K26</p><h1>Gallery</h1><p>A visual archive for COLORIDO memories, performances and sporting moments.</p></div></header><section><div class="wrap"><div class="filters"><div class="chips" id="filters"><button class="chip active" data-category="">All</button><button class="chip" data-category="Cultural">Cultural</button><button class="chip" data-category="Sports">Sports</button></div></div><div class="grid" id="gallery"><p class="empty">Loading gallery…</p></div></div></section><div id="footer"></div><script src="/js/app.js"></script><script>renderChrome("Gallery");let all=[];function renderGallery(){const cat=document.querySelector(".chip.active")?.dataset.category||"";const rows=all.filter(x=>!cat||x.category===cat);document.getElementById("gallery").innerHTML=rows.length?rows.map(x=>`<article class="card reveal"><div style="aspect-ratio:16/9;border-radius:10px;background:linear-gradient(135deg,#0f172a,#312e81);display:grid;place-items:center;color:#fff;font-size:2rem">COLORIDO</div><span class="tag ${x.category?.toLowerCase()||""}">${esc(x.category||"Festival")}</span><h3>${esc(x.caption||"COLORIDO moment")}</h3><p>${esc(x.year||"2026")} · Official gallery placeholder</p></article>`).join(""):'<p class="empty">No gallery items are available for this category yet.</p>';initReveal()}(async()=>{try{all=await api("/gallery");renderGallery()}catch(e){document.getElementById("gallery").innerHTML='<p class="empty">Unable to load the gallery right now.</p>';toast(e.message)}})();document.getElementById("filters").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));b.classList.add("active");renderGallery()});</script></body></html>
